document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;

          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

le*=\"min-height\"]{min-height:0 !important;}\n  [data-screen-label=\"Konsortium\"] div[style*=\"repeat(4\"]{grid-auto-rows:auto !important;}}\nbody.m-view [data-screen-label=\"Konsortium\"] span[style*=\"min-height\"]{min-height:0 !important;}\nbody.m-view [data-screen-label=\"Konsortium\"] div[style*=\"repeat(4\"]{grid-auto-rows:auto !important;}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n<div style=\"background:#F5F5F2;display:flex;flex-direction:column;\">\n  <header style=\"display:flex;align-items:center;justify-content:space-between;padding:28px 64px;max-width:1360px;width:100%;margin:0 auto;box-sizing:border-box;\">\n    <a href=\"index.dc.html\" aria-label=\"enercept\" style=\"display:block;width:196px;\">\n      <img src=\"44d0383f-15ce-43fc-be5c-81e844320d43\" alt=\"enercept\" style=\"width:196px;display:block;\">\n    <\u002Fa>\n    <nav class=\"c-nav\" style=\"display:flex;align-items:center;gap:40px;\">\n      <a href=\"index.dc.html#software\" style=\"color:#1E3B33;font-size:15px;\" style-hover=\"color:#8A6A1A;\">Unsere Lösung<\u002Fa>\n      <a href=\"index.dc.html#ueber-uns\" style=\"color:#1E3B33;font-size:15px;\" style-hover=\"color:#8A6A1A;\">Über uns<\u002Fa>\n      <a href=\"forschung.dc.html\" style=\"color:#1E3B33;font-size:15px;font-weight:600;border-bottom:2px solid #D9A441;padding-bottom:2px;\">Forschung<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ openContact }}\" style=\"background:#1E3B33;color:#F5F5F2;font-size:15px;font-weight:600;padding:11px 24px;border-radius:6px;\" style-hover=\"background:#16302A;color:#F5F5F2;\">Demo anfragen<\u002Fa>\n    <\u002Fnav>\n    <button class=\"c-burger\" sc-camel-on-click=\"{{ toggleMenu }}\" aria-label=\"Menü\">\n      <span style=\"width:20px;height:2px;background:#1E3B33;\"><\u002Fspan>\n      <span style=\"width:20px;height:2px;background:#1E3B33;\"><\u002Fspan>\n      <span style=\"width:20px;height:2px;background:#1E3B33;\"><\u002Fspan>\n    <\u002Fbutton>\n  <\u002Fheader>\n  <section data-screen-label=\"Forschung Hero\" style=\"max-width:1360px;width:100%;margin:0 auto;box-sizing:border-box;padding:56px 64px 72px;\">\n    <div style=\"display:flex;align-items:center;gap:12px;margin-bottom:24px;\">\n      <span style=\"width:32px;height:2px;background:#D9A441;\"><\u002Fspan>\n      <span style=\"font-size:14px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;\">Forschung<\u002Fspan>\n    <\u002Fdiv>\n    <h1 style=\"font-size:52px;line-height:1.1;font-weight:700;margin:0 0 22px;color:#1E3B33;letter-spacing:-0.02em;max-width:860px;text-wrap:balance;\">Forschung, die die Plattform von morgen prägt.<\u002Fh1>\n    <p style=\"font-size:19px;line-height:1.6;margin:0;color:#3d564d;max-width:760px;text-wrap:pretty;\">enercept entsteht aus dem Betriebsalltag — und aus angewandter Forschung. Wir forschen an der Automatisierung dezentraler Energiesysteme, mit dem Ziel, diese auf ein neues Niveau zu heben. Was hier entsteht, prägt, wohin wir die Plattform entwickeln.<\u002Fp>\n  <\u002Fsection>\n  <section data-screen-label=\"Herausforderung\" style=\"background:#16302A;\">\n    <div style=\"max-width:1360px;margin:0 auto;box-sizing:border-box;padding:80px 64px;\">\n    <div style=\"display:flex;flex-direction:column;gap:18px;margin-bottom:56px;\">\n      <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#D9A441;\">Die Herausforderung<\u002Fspan>\n      <h2 style=\"font-size:38px;line-height:1.2;font-weight:700;margin:0;color:#EFF3EE;letter-spacing:-0.02em;max-width:720px;text-wrap:balance;\">Die Energiewende braucht intelligente Software<\u002Fh2>\n      <p style=\"margin:0;font-size:17px;line-height:1.65;color:#b9c6bd;max-width:760px;text-wrap:pretty;\">Dezentrale Energiesysteme werden immer komplexer. Wind, Solar, Speicher und Verbraucher müssen in Echtzeit koordiniert werden – über verschiedene Standorte, Anlagentypen und Zeithorizonte hinweg.<\u002Fp>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-auto-rows:1fr;gap:24px;margin-bottom:0;\">\n      <article style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-radius:10px;padding:40px 36px;display:flex;flex-direction:column;gap:16px;min-width:0;\">\n        <span style=\"width:32px;height:3px;background:#D9A441;\"><\u002Fspan>\n        <h3 style=\"margin:0;font-size:22px;line-height:1.35;font-weight:600;color:#EFF3EE;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;min-height:60px;\">Heterogene Systemlandschaften<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#b9c6bd;text-wrap:pretty;\">Arealnetze bestehen aus Erzeugern, Speichern und Verbrauchern mit völlig unterschiedlichen Innovationszyklen (2–25 Jahre). Manuelle Steuerung skaliert nicht.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-radius:10px;padding:40px 36px;display:flex;flex-direction:column;gap:16px;min-width:0;\">\n        <span style=\"width:32px;height:3px;background:#D9A441;\"><\u002Fspan>\n        <h3 style=\"margin:0;font-size:22px;line-height:1.35;font-weight:600;color:#EFF3EE;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;min-height:60px;\">Datensilos verhindern Optimierung<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#b9c6bd;text-wrap:pretty;\">Anlagendaten, Wetterdaten, Marktdaten und Betriebsdaten liegen verstreut in verschiedenen Systemen – ohne einheitliches Modell.<\u002Fp>\n      <\u002Farticle>\n      <article style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-radius:10px;padding:40px 36px;display:flex;flex-direction:column;gap:16px;min-width:0;\">\n        <span style=\"width:32px;height:3px;background:#D9A441;\"><\u002Fspan>\n        <h3 style=\"margin:0;font-size:22px;line-height:1.35;font-weight:600;color:#EFF3EE;text-wrap:balance;overflow-wrap:anywhere;hyphens:auto;min-height:60px;\">KI-Modelle veralten<\u002Fh3>\n        <p style=\"margin:0;font-size:16px;line-height:1.65;color:#b9c6bd;text-wrap:pretty;\">Energiesysteme verändern sich kontinuierlich. KI-Modelle, die auf einer bestimmten Konfiguration trainiert wurden, verlieren schrittweise ihre Gültigkeit – ohne dass es jemand bemerkt.<\u002Fp>\n      <\u002Farticle>\n    <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n<section data-screen-label=\"Forschungsfelder\" style=\"background:#FAF7F1;border-top:1px solid #e4e2d9;border-bottom:1px solid #e4e2d9;\">\n    <div style=\"max-width:1360px;margin:0 auto;box-sizing:border-box;padding:80px 64px;\">\n      <div style=\"display:flex;flex-direction:column;gap:14px;margin-bottom:48px;\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;\">Fragen, mit denen wir uns beschäftigen<\u002Fspan>\n        <h2 style=\"font-size:38px;line-height:1.2;font-weight:700;margin:0;color:#1E3B33;letter-spacing:-0.02em;\">Unsere Forschungsfelder<\u002Fh2>\n        <p style=\"margin:0;font-size:17px;line-height:1.65;color:#3d564d;max-width:760px;text-wrap:pretty;\">Diese Fragen entstehen aus dem Betriebsalltag — und aus unserer Forschung im Konsortium.<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"c-ff-grid c-cards\" style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:1fr;gap:24px;align-items:stretch;max-width:1000px;\">\n        <article style=\"background:#F5F5F2;border:1px solid #e4e2d9;border-radius:10px;padding:44px 32px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;overflow-wrap:anywhere;min-height:32px;display:block;\">Digitaler Zwilling<\u002Fspan>\n          <div style=\"display:flex;gap:14px;align-items:flex-start;min-height:78px;\">\n            <span aria-hidden=\"true\" style=\"font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1;font-weight:700;color:#D9A441;flex-shrink:0;transform:translateY(4px);\">“<\u002Fspan>\n            <h3 style=\"margin:0;font-size:20px;line-height:1.35;font-weight:600;color:#1E3B33;text-wrap:pretty;overflow-wrap:anywhere;hyphens:auto;\">Wie lässt sich ein Energiesystem über alle Anlagenklassen hinweg einheitlich abbilden?<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;line-height:1.65;color:#3d564d;text-wrap:pretty;border-top:1px solid #e4e2d9;padding-top:14px;\">Ein digitales Echtzeit-Abbild über verschiedene Anlagenklassen hinweg — Wind, Solar, Speicher, Verbraucher.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#F5F5F2;border:1px solid #e4e2d9;border-radius:10px;padding:44px 32px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;overflow-wrap:anywhere;min-height:32px;display:block;\">KI-gestützte Prognose &amp; Optimierung<\u002Fspan>\n          <div style=\"display:flex;gap:14px;align-items:flex-start;min-height:78px;\">\n            <span aria-hidden=\"true\" style=\"font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1;font-weight:700;color:#D9A441;flex-shrink:0;transform:translateY(4px);\">“<\u002Fspan>\n            <h3 style=\"margin:0;font-size:20px;line-height:1.35;font-weight:600;color:#1E3B33;text-wrap:pretty;overflow-wrap:anywhere;hyphens:auto;\">Wie lassen sich physikalisches Domänenwissen und Machine Learning verbinden?<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;line-height:1.65;color:#3d564d;text-wrap:pretty;border-top:1px solid #e4e2d9;padding-top:14px;\">Prognosen aus der Kombination von physikalischem Domänenwissen und Machine Learning.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#F5F5F2;border:1px solid #e4e2d9;border-radius:10px;padding:44px 32px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;overflow-wrap:anywhere;min-height:32px;display:block;\">Entscheidungsautomatisierung<\u002Fspan>\n          <div style=\"display:flex;gap:14px;align-items:flex-start;min-height:78px;\">\n            <span aria-hidden=\"true\" style=\"font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1;font-weight:700;color:#D9A441;flex-shrink:0;transform:translateY(4px);\">“<\u002Fspan>\n            <h3 style=\"margin:0;font-size:20px;line-height:1.35;font-weight:600;color:#1E3B33;text-wrap:pretty;overflow-wrap:anywhere;hyphens:auto;\">Welche Entscheidungen der operativen Betriebsführung lassen sich automatisieren?<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;line-height:1.65;color:#3d564d;text-wrap:pretty;border-top:1px solid #e4e2d9;padding-top:14px;\">Lernende Steuerungslogiken für die operative Betriebsführung.<\u002Fp>\n        <\u002Farticle>\n        <article style=\"background:#F5F5F2;border:1px solid #e4e2d9;border-radius:10px;padding:44px 32px;display:flex;flex-direction:column;gap:14px;min-width:0;\">\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;overflow-wrap:anywhere;min-height:32px;display:block;\">KI-Governance &amp; MLOps<\u002Fspan>\n          <div style=\"display:flex;gap:14px;align-items:flex-start;min-height:78px;\">\n            <span aria-hidden=\"true\" style=\"font-family:Georgia,'Times New Roman',serif;font-size:44px;line-height:1;font-weight:700;color:#D9A441;flex-shrink:0;transform:translateY(4px);\">“<\u002Fspan>\n            <h3 style=\"margin:0;font-size:20px;line-height:1.35;font-weight:600;color:#1E3B33;text-wrap:pretty;overflow-wrap:anywhere;hyphens:auto;\">Wie bleiben KI-Modelle im laufenden Betrieb verlässlich?<\u002Fh3>\n          <\u002Fdiv>\n          <p style=\"margin:0;font-size:16px;line-height:1.65;color:#3d564d;text-wrap:pretty;border-top:1px solid #e4e2d9;padding-top:14px;\">Verlässliche KI im laufenden Betrieb — mit Drift-Erkennung und kontrollierter Modellübergabe.<\u002Fp>\n        <\u002Farticle>\n      <\u002Fdiv>\n      <div class=\"c-dots\"><span class=\"on\"><\u002Fspan><span><\u002Fspan><span><\u002Fspan><span><\u002Fspan><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  \n  <section data-screen-label=\"Architektur\" style=\"background:#16302A;\">\n    <div style=\"max-width:1360px;margin:0 auto;box-sizing:border-box;padding:80px 64px;\">\n      <div style=\"display:flex;flex-direction:column;gap:10px;margin:0 0 48px;\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#D9A441;margin-bottom:8px;\">Wie könnte ein Zielbild aussehen?<\u002Fspan>\n        <h2 style=\"font-size:38px;line-height:1.2;font-weight:700;margin:0;color:#EFF3EE;letter-spacing:-0.02em;text-wrap:balance;\">So könnte die Betriebsführung von morgen aussehen<\u002Fh2>\n        \n      <\u002Fdiv>\n      <div style=\"display:grid;grid-template-columns:1.35fr 1fr;gap:56px;align-items:start;\">\n        <div style=\"display:flex;flex-direction:column;gap:16px;\">\n          <div style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-left:3px solid #D9A441;border-radius:10px;padding:28px 30px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;\">\n              <span style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#D9A441;\">Ebene 1 · Physisch<\u002Fspan>\n              <span style=\"font-size:13px;color:#b9c6bd;\">Reales Arealnetz<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:0;font-size:20px;font-weight:600;color:#EFF3EE;\">Erzeugung, Speicherung, Verbrauch<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:#b9c6bd;text-wrap:pretty;\">Sensoren erfassen den Echtzeit-Zustand aller physischen Anlagen am Standort.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;\">\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Windenergieanlagen<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">PV-Systeme<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Speichersysteme<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Industrieverbraucher<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv><div style=\"display:flex;justify-content:center;\"><span style=\"color:#D9A441;font-size:18px;\">↕<\u002Fspan><\u002Fdiv>\n          <div style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-left:3px solid #D9A441;border-radius:10px;padding:28px 30px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;\">\n              <span style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#D9A441;\">Ebene 2 · Edge<\u002Fspan>\n              <span style=\"font-size:13px;color:#b9c6bd;\">Vor Ort im Arealnetz<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:0;font-size:20px;font-weight:600;color:#EFF3EE;\">Lokale Autonomie, Echtzeitentscheidungen<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:#b9c6bd;text-wrap:pretty;\">Der lokale Digitale Zwilling verarbeitet Daten und trifft autonome Entscheidungen in Echtzeit.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;\">\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Lokaler Digitaler Zwilling<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Echtzeit-Steuerung<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Adaptive Regelung<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:flex;justify-content:center;\"><span style=\"color:#D9A441;font-size:18px;\">↕<\u002Fspan><\u002Fdiv>\n          <div style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-left:3px solid #D9A441;border-radius:10px;padding:28px 30px;display:flex;flex-direction:column;gap:10px;\">\n            <div style=\"display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;\">\n              <span style=\"font-size:13px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:#D9A441;\">Ebene 3 · Cloud<\u002Fspan>\n              <span style=\"font-size:13px;color:#b9c6bd;\">Rechenzentrum<\u002Fspan>\n            <\u002Fdiv>\n            <h3 style=\"margin:0;font-size:20px;font-weight:600;color:#EFF3EE;\">Aggregation, Training, Systemoptimierung<\u002Fh3>\n            <p style=\"margin:0;font-size:16px;line-height:1.6;color:#b9c6bd;text-wrap:pretty;\">Standortübergreifende Prognosen, Modelltraining und Optimierung des Gesamtsystems.<\u002Fp>\n            <div style=\"display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;\">\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Systemweiter Digitaler Zwilling<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">Prognose &amp; Optimierung<\u002Fspan>\n              <span style=\"border:1px solid rgba(239,243,238,0.25);border-radius:999px;padding:5px 14px;font-size:12px;color:#b9c6bd;\">KI-Governance &amp; MLOps<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          \n        <\u002Fdiv>\n        <div style=\"display:flex;flex-direction:column;gap:24px;position:sticky;top:32px;\">\n          <p style=\"margin:0;font-size:16px;line-height:1.7;color:#b9c6bd;text-wrap:pretty;\">Die Plattform arbeitet auf drei Ebenen: Am physischen Standort erfassen Sensoren den Echtzeit-Zustand. Auf der Edge-Ebene verarbeitet ein lokaler Digitaler Zwilling die Daten und trifft autonome Entscheidungen. In der Cloud werden standortübergreifende Prognosen erstellt, Modelle trainiert und das Gesamtsystem optimiert.<\u002Fp>\n          <div style=\"background:rgba(239,243,238,0.05);border:1px solid rgba(239,243,238,0.14);border-radius:10px;padding:12px;\">\n            <image-slot id=\"wimmelbild\" shape=\"rounded\" radius=\"6\" style=\"width:100%;height:280px;background:#EFF3EE;border-radius:6px;\" placeholder=\"Wimmelbild: Das enercept-Ökosystem im Überblick (wimmel.jpg)\" src=\"a7d651d0-6b3e-4d42-89c7-1dee50365539\"><\u002Fimage-slot>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <section data-screen-label=\"Konsortium\" style=\"max-width:1360px;width:100%;margin:0 auto;box-sizing:border-box;padding:80px 64px;\">\n    <h2 style=\"font-size:38px;line-height:1.2;font-weight:700;margin:0 0 16px;color:#1E3B33;letter-spacing:-0.02em;\">Konsortium &amp; Partner<\u002Fh2>\n    <p style=\"margin:0 0 48px;font-size:17px;line-height:1.65;color:#3d564d;max-width:760px;text-wrap:pretty;\">Ein starkes Netzwerk aus vier Industriepartnern und fünf wissenschaftlichen Institutionen, das Domänenwissen, Software-Kompetenz und Forschungsexzellenz vereint.<\u002Fp>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));grid-auto-rows:1fr;gap:24px;\">\n      <div style=\"border:1px solid #e4e2d9;border-radius:10px;padding:28px 26px;display:flex;flex-direction:column;gap:10px;background:#FAF7F1;min-width:0;\">\n        <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#1E3B33;overflow-wrap:anywhere;hyphens:auto;\">EOW<\u002Fh3>\n        <span style=\"font-size:13px;font-weight:600;color:#8A6A1A;line-height:1.4;min-height:2.8em;display:block;overflow-wrap:anywhere;\">Konsortialleiter &amp; Anwendungspartner<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3d564d;overflow-wrap:anywhere;hyphens:auto;text-wrap:pretty;\">Betreiber dezentraler Energiesysteme. Liefert den realen Use Case und Demonstrator-Infrastruktur.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #e4e2d9;border-radius:10px;padding:28px 26px;display:flex;flex-direction:column;gap:10px;background:#FAF7F1;min-width:0;\">\n        <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#1E3B33;overflow-wrap:anywhere;hyphens:auto;\">savvytec<\u002Fh3>\n        <span style=\"font-size:13px;font-weight:600;color:#8A6A1A;line-height:1.4;min-height:2.8em;display:block;overflow-wrap:anywhere;\">Technischer Architekt &amp; Software-Backbone<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3d564d;overflow-wrap:anywhere;hyphens:auto;text-wrap:pretty;\">Langjährige Plattform-Expertise aus Automotive &amp; Industrie. Verantwortet Architektur und KI-Governance.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #D9A441;border-radius:10px;padding:28px 26px;display:flex;flex-direction:column;gap:10px;background:#FAF7F1;min-width:0;\">\n        <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#1E3B33;overflow-wrap:anywhere;hyphens:auto;\">enercept<\u002Fh3>\n        <span style=\"font-size:13px;font-weight:600;color:#8A6A1A;line-height:1.4;min-height:2.8em;display:block;overflow-wrap:anywhere;\">KI- &amp; Innovation-Powerhouse<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3d564d;overflow-wrap:anywhere;hyphens:auto;text-wrap:pretty;\">Startup-Agilität für domänenspezifische Automatisierungslösungen. Beteiligt an der Mehrzahl der Arbeitspakete.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"border:1px solid #e4e2d9;border-radius:10px;padding:28px 26px;display:flex;flex-direction:column;gap:10px;background:#FAF7F1;min-width:0;\">\n        <h3 style=\"margin:0;font-size:18px;font-weight:600;color:#1E3B33;overflow-wrap:anywhere;hyphens:auto;\">aixit<\u002Fh3>\n        <span style=\"font-size:13px;font-weight:600;color:#8A6A1A;line-height:1.4;min-height:2.8em;display:block;overflow-wrap:anywhere;\">Infrastrukturpartner<\u002Fspan>\n        <p style=\"margin:0;font-size:14px;line-height:1.6;color:#3d564d;overflow-wrap:anywhere;hyphens:auto;text-wrap:pretty;\">Cloud- und Edge-Infrastruktur. windCORES-Rechenzentrum in Windenergieanlagen.<\u002Fp>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsection>\n  <footer style=\"background:#16302A;\">\n    <div style=\"max-width:1360px;margin:0 auto;box-sizing:border-box;padding:40px 64px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap;\">\n      <span style=\"color:#b9c6bd;font-size:13px;\">kontakt@enercept.de · Technologiepark 18, 33100 Paderborn<\u002Fspan>\n      <div style=\"display:flex;align-items:center;gap:40px;\">\n        <nav style=\"display:flex;gap:24px;\">\n          <a href=\"rechtliches.dc.html#impressum\" style=\"color:#b9c6bd;font-size:13px;\" style-hover=\"color:#D9A441;\">Impressum<\u002Fa>\n          <a href=\"rechtliches.dc.html#datenschutz\" style=\"color:#b9c6bd;font-size:13px;\" style-hover=\"color:#D9A441;\">Datenschutz<\u002Fa>\n        <\u002Fnav>\n        <span style=\"color:#b9c6bd;font-size:13px;\">© 2026 Enercept GmbH<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Ffooter>\n  <sc-if value=\"{{ showTopBtn }}\" hint-placeholder-val=\"{{ false }}\">\n    <button sc-camel-on-click=\"{{ scrollTop }}\" aria-label=\"Nach oben\" class=\"c-topbtn\" style=\"position:fixed;right:28px;bottom:28px;z-index:80;width:48px;height:48px;border-radius:50%;background:#1E3B33;color:#F5F5F2;border:none;cursor:pointer;font-size:20px;box-shadow:0 8px 24px rgba(22,48,42,0.35);display:flex;align-items:center;justify-content:center;\" style-hover=\"background:#16302A;\">↑<\u002Fbutton>\n  <\u002Fsc-if>\n  <button sc-camel-on-click=\"{{ toggleView }}\" aria-label=\"Desktop/Mobile umschalten\" style=\"position:fixed;top:14px;right:14px;z-index:120;width:44px;height:44px;border-radius:50%;background:#1E3B33;color:#F5F5F2;border:2px solid #D9A441;cursor:pointer;font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;\">{{ toggleLabel }}<\u002Fbutton>\n<sc-if value=\"{{ menuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n  <div class=\"c-menu-ov\" sc-camel-on-click=\"{{ closeMenu }}\" style=\"position:fixed;inset:0;z-index:85;background:rgba(255,255,255,0.6);\">\n    <div sc-camel-on-click=\"{{ stopProp }}\" style=\"position:absolute;top:76px;left:16px;right:16px;background:#F5F5F2;border:1px solid #d8d5ca;border-radius:12px;box-shadow:0 12px 40px rgba(0,0,0,0.18);padding:12px;display:flex;flex-direction:column;\">\n      <a href=\"index.dc.html#software\" style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;color:#1E3B33;font-size:17px;font-weight:600;border-radius:8px;\" style-hover=\"background:#EFF3EE;color:#1E3B33;\">Unsere Lösung<\u002Fa>\n      <a href=\"index.dc.html#ueber-uns\" style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;color:#1E3B33;font-size:17px;font-weight:600;border-radius:8px;\" style-hover=\"background:#EFF3EE;color:#1E3B33;\">Über uns<\u002Fa>\n      <a href=\"forschung.dc.html\" style=\"display:flex;align-items:center;min-height:48px;padding:0 16px;color:#1E3B33;font-size:17px;font-weight:600;border-radius:8px;\" style-hover=\"background:#EFF3EE;color:#1E3B33;\">Forschung<\u002Fa>\n      <a href=\"#\" sc-camel-on-click=\"{{ openContactFromMenu }}\" style=\"display:flex;align-items:center;justify-content:center;min-height:48px;margin:8px 4px 4px;background:#1E3B33;color:#F5F5F2;font-size:16px;font-weight:600;border-radius:8px;box-shadow:inset 0 -3px 0 #D9A441;\" style-hover=\"background:#16302A;color:#F5F5F2;\">Demo anfragen<\u002Fa>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ contactOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div class=\"c-modal-ov\" sc-camel-on-click=\"{{ closeContact }}\" style=\"position:fixed;inset:0;background:rgba(255,255,255,0.75);z-index:90;display:flex;align-items:flex-start;justify-content:center;padding:24px;overflow-y:auto;\">\n      <div class=\"c-modal\" sc-camel-on-click=\"{{ stopProp }}\" style=\"background:#F5F5F2;border-radius:16px;max-width:620px;width:100%;padding:76px 64px;box-sizing:border-box;display:flex;flex-direction:column;gap:40px;position:relative;box-shadow:0 2px 6px rgba(0,0,0,0.12),0 16px 56px rgba(0,0,0,0.28);border:1px solid #d8d5ca;\">\n        <button sc-camel-on-click=\"{{ closeContact }}\" aria-label=\"Schließen\" style=\"position:absolute;top:18px;right:18px;background:none;border:none;font-size:22px;color:#3d564d;cursor:pointer;line-height:1;padding:6px;font-family:'Poppins',sans-serif;\">×<\u002Fbutton>\n        <div style=\"display:flex;flex-direction:column;gap:10px;\">\n          <h2 style=\"margin:0;font-size:34px;font-weight:700;color:#1E3B33;letter-spacing:-0.02em;\">Sprechen wir über Ihren Betrieb.<\u002Fh2>\n          <p style=\"margin:0;font-size:16px;line-height:1.6;color:#3d564d;\">Ob Demo, Partnerschaft oder Frage — melden Sie sich direkt.<\u002Fp>\n        <\u002Fdiv>\n<div style=\"display:flex;flex-direction:column;gap:20px;border-top:1px solid #e4e2d9;padding-top:32px;\">\n        <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;\">IHRE KONTAKTDATEN HINTERLASSEN<\u002Fspan>\n        <sc-if value=\"{{ leadSent }}\" hint-placeholder-val=\"{{ false }}\">\n          <div style=\"display:flex;align-items:center;gap:14px;background:#EFF3EE;border:1px solid #cfdccf;border-radius:8px;padding:18px 20px;\">\n            <span style=\"width:26px;height:26px;border-radius:50%;background:#1E3B33;color:#D9A441;display:flex;align-items:center;justify-content:center;font-size:14px;flex-shrink:0;\">✓<\u002Fspan>\n            <p style=\"margin:0;font-size:16px;line-height:1.5;color:#1E3B33;font-weight:600;\">Danke! Wir melden uns zeitnah bei Ihnen.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <sc-if value=\"{{ leadFormVisible }}\" hint-placeholder-val=\"{{ true }}\">\n          <div style=\"display:flex;flex-direction:column;gap:12px;\">\n            <input type=\"email\" value=\"{{ leadEmail }}\" sc-camel-on-change=\"{{ setLeadEmail }}\" placeholder=\"Ihre E-Mail-Adresse\" style=\"box-sizing:border-box;width:100%;min-height:52px;padding:0 18px;font-family:'Poppins',sans-serif;font-size:16px;color:#1E3B33;background:#fff;border:1px solid #d8d5ca;border-radius:8px;outline:none;\" style-focus=\"border:1px solid #1E3B33;\">\n            <textarea value=\"{{ leadMsg }}\" sc-camel-on-change=\"{{ setLeadMsg }}\" placeholder=\"Ihr Anliegen (optional)\" rows=\"3\" style=\"box-sizing:border-box;width:100%;padding:14px 18px;font-family:'Poppins',sans-serif;font-size:15px;line-height:1.5;color:#1E3B33;background:#fff;border:1px solid #d8d5ca;border-radius:8px;outline:none;resize:vertical;\" style-focus=\"border:1px solid #1E3B33;\"><\u002Ftextarea>\n            <sc-if value=\"{{ leadError }}\" hint-placeholder-val=\"{{ false }}\">\n              <p style=\"margin:0;font-size:13px;color:#a3452c;\">Bitte eine gültige E-Mail-Adresse angeben.<\u002Fp>\n            <\u002Fsc-if>\n            <button sc-camel-on-click=\"{{ submitLead }}\" style=\"align-self:flex-start;min-height:50px;padding:0 30px;background:#1E3B33;color:#F5F5F2;font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;border:none;border-radius:6px;box-shadow:inset 0 -3px 0 #D9A441;cursor:pointer;\" style-hover=\"background:#16302A;\">absenden<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fsc-if>\n        <div style=\"display:flex;flex-direction:column;gap:18px;border-top:1px solid #e4e2d9;padding-top:24px;\">\n          <span style=\"font-size:12px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#8A6A1A;\">ODER KONTAKTIEREN SIE UNS DIREKT<\u002Fspan>\n          <div style=\"display:flex;flex-direction:column;gap:4px;\">\n            <span style=\"font-size:13px;color:#3d564d;\">E-Mail<\u002Fspan>\n            <a href=\"mailto:kontakt@enercept.de\" style=\"color:#1E3B33;font-size:18px;font-weight:600;\" style-hover=\"color:#8A6A1A;\">kontakt@enercept.de<\u002Fa>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n\n<\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { view: (typeof localStorage !== 'undefined' && localStorage.getItem('enercept-view')) || 'd', menuOpen: false, contactOpen: false, leadEmail: '', leadMsg: '', leadSent: false, leadError: false, p: 0, showTopBtn: false };\n  _scroller() {\n    const cands = [document.getElementById('dc-root'), document.body, document.scrollingElement, document.documentElement];\n    for (const el of cands) {\n      if (!el) continue;\n      const ovY = getComputedStyle(el).overflowY;\n      const scrollable = ovY === 'auto' || ovY === 'scroll' || ovY === 'overlay' || el === document.scrollingElement || el === document.documentElement;\n      if (scrollable && el.scrollHeight > el.clientHeight + 4) return el;\n    }\n    return null;\n  }\n  _scrollToEl(el, offset) {\n    const sc = this._scroller();\n    if (!sc) return false;\n    const isWin = sc === document.scrollingElement || sc === document.documentElement || sc === document.body;\n    const top = isWin\n      ? el.getBoundingClientRect().top + window.scrollY - offset\n      : el.getBoundingClientRect().top - sc.getBoundingClientRect().top + sc.scrollTop - offset;\n    if (isWin) window.scrollTo({ top, behavior: 'smooth' }); else sc.scrollTo({ top, behavior: 'smooth' });\n    return true;\n  }\n  _bindDots() {\n    document.querySelectorAll('.c-cards').forEach((car) => {\n      const dots = car.parentElement.querySelector('.c-dots');\n      if (!dots) return;\n      const spans = Array.from(dots.children);\n      const upd = () => {\n        const max = car.scrollWidth - car.clientWidth;\n        const i = max > 0 ? Math.round((car.scrollLeft / max) * (spans.length - 1)) : 0;\n        spans.forEach((s, j) => s.classList.toggle('on', j === i));\n      };\n      if (!car._dotsBound) {\n        car.addEventListener('scroll', upd, { passive: true });\n        spans.forEach((s, j) => s.addEventListener('click', () => {\n          car.scrollTo({ left: (j * (car.scrollWidth - car.clientWidth)) / (spans.length - 1), behavior: 'smooth' });\n        }));\n        car._dotsBound = true;\n      }\n      upd();\n    });\n  }\n  componentDidUpdate() { this._bindDots(); }\n  componentDidMount() {\n    setTimeout(() => this._bindDots(), 60);\n    document.body.classList.toggle('m-view', this.state.view === 'm');\n    this._offset = () => (document.body.classList.contains('m-view') || window.innerWidth < 768) ? 16 : 24;\n    this._onAnchorClick = (ev) => {\n      const a = ev.target.closest && ev.target.closest('a[href*=\"#\"]');\n      if (!a) return;\n      const href = a.getAttribute('href') || '';\n      const hash = href.split('#')[1];\n      if (!hash) return;\n      const page = href.split('#')[0];\n      const here = location.pathname.split('/').pop();\n      if (page && page !== here) return;\n      if (hash === 'kontakt') return;\n      const el = document.getElementById(hash);\n      if (!el) return;\n      if (this.state.menuOpen) this.setState({ menuOpen: false });\n      if (this._scroller()) {\n        ev.preventDefault();\n        history.replaceState(null, '', '#' + hash);\n        requestAnimationFrame(() => this._scrollToEl(el, this._offset()));\n      }\n    };\n    document.addEventListener('click', this._onAnchorClick, true);\n    const hashOnLoad = (location.hash || '').replace('#', '');\n    if (hashOnLoad) {\n      let tries = 0;\n      const jump = () => {\n        const el = document.getElementById(hashOnLoad);\n        if (el) this._scrollToEl(el, this._offset());\n        else if (++tries < 20) setTimeout(jump, 150);\n      };\n      setTimeout(jump, 60);\n    }\n\n    this._onScroll = () => {\n      const sc = this._scroller();\n      const show = (!sc || sc === document.scrollingElement || sc === document.documentElement || sc === document.body ? window.scrollY : sc.scrollTop) > window.innerHeight;\n      if (show !== this.state.showTopBtn) this.setState({ showTopBtn: show });\n    };\n    window.addEventListener('scroll', this._onScroll, { passive: true });\n    this._root = document.getElementById('dc-root');\n    if (this._root) this._root.addEventListener('scroll', this._onScroll, { passive: true });\n    // Zahlen zählen gemeinsam hoch (gleiche Dauer, ease-out), starten beim ersten Sichtbarwerden\n    const el = document.querySelector('[data-count]');\n    const start = () => {\n      if (this._started) return; this._started = true;\n      const t0 = performance.now(), dur = 1600;\n      const tick = (t) => {\n        const x = Math.min(1, (t - t0) / dur);\n        this.setState({ p: 1 - Math.pow(1 - x, 3) });\n        if (x < 1) requestAnimationFrame(tick);\n      };\n      requestAnimationFrame(tick);\n    };\n    if (el && 'IntersectionObserver' in window) {\n      this._io = new IntersectionObserver((es) => { if (es.some(e => e.isIntersecting)) { start(); this._io.disconnect(); } }, { threshold: 0.4 });\n      this._io.observe(el.parentElement.parentElement);\n    } else start();\n  }\n  componentWillUnmount() { if (this._io) this._io.disconnect(); if (this._onScroll) { window.removeEventListener('scroll', this._onScroll); if (this._root) this._root.removeEventListener('scroll', this._onScroll); } }\n  renderVals() {\n    const p = this.state.p;\n    return {\n      toggleLabel: this.state.view === 'm' ? 'D' : 'M',\n      toggleView: () => {\n        const view = this.state.view === 'm' ? 'd' : 'm';\n        this.setState({ view, menuOpen: false });\n        document.body.classList.toggle('m-view', view === 'm');\n        try { localStorage.setItem('enercept-view', view); } catch (e) {}\n      },\n      menuOpen: this.state.menuOpen,\n      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),\n      closeMenu: () => this.setState({ menuOpen: false }),\n      openContactFromMenu: (e) => { e.preventDefault(); this.setState({ contactOpen: true, menuOpen: false }); },\n      count42: Math.round(42 * p),\n      count16: Math.round(16 * p),\n      count135: (13.5 * p).toFixed(1).replace('.', ','),\n      count4: Math.round(4 * p),\n      contactOpen: this.state.contactOpen,\n      showTopBtn: this.state.showTopBtn,\n      scrollTop: () => { const sc = this._scroller(); if (!sc || sc === document.scrollingElement || sc === document.documentElement || sc === document.body) window.scrollTo({ top: 0, behavior: 'smooth' }); else sc.scrollTo({ top: 0, behavior: 'smooth' }); },\n      openContact: (e) => { e.preventDefault(); this.setState({ contactOpen: true }); },\n      closeContact: () => this.setState({ contactOpen: false, leadSent: false, leadError: false }),\n      leadEmail: this.state.leadEmail,\n      leadMsg: this.state.leadMsg,\n      leadSent: this.state.leadSent,\n      leadFormVisible: !this.state.leadSent,\n      leadError: this.state.leadError,\n      setLeadEmail: (e) => this.setState({ leadEmail: e.target.value, leadError: false }),\n      setLeadMsg: (e) => this.setState({ leadMsg: e.target.value }),\n      submitLead: () => {\n        const em = this.state.leadEmail.trim();\n        if (!/^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(em)) { this.setState({ leadError: true }); return; }\n        this.setState({ leadSent: true, leadEmail: '', leadMsg: '', leadError: false });\n      },\n\n      stopProp: (e) => e.stopPropagation()\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
